name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes "root@$DEPLOY_HOST" 'true'

      - name: Upload application code
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          rsync -az \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='.git/' \
            --exclude='.venv/' \
            --exclude='__pycache__/' \
            --exclude='.pytest_cache/' \
            --exclude='graphify-out/' \
            --exclude='.codex/' \
            -e 'ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes' \
            ./ "root@$DEPLOY_HOST:/opt/arbivision/"

      - name: Rebuild and restart application
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes "root@$DEPLOY_HOST" \
            'cd /opt/arbivision &&
             docker compose -f docker-compose.prod.yml up -d --build app &&
             for _ in $(seq 1 45); do
               if curl -fsS http://127.0.0.1:8000/api/health >/dev/null 2>&1; then
                 curl -fsS http://127.0.0.1:8000/api/health
                 exit 0
               fi
               sleep 2
             done
             echo "App health check did not succeed within 90 seconds" >&2
             exit 1'
